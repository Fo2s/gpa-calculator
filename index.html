<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GPA Calculator</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fb;
        --bg-alt: #edf3f7;
        --panel: #ffffff;
        --surface: #fbfcfe;
        --input: #ffffff;
        --text: #172033;
        --muted: #5b667a;
        --line: #dce3ee;
        --accent: #14786a;
        --accent-dark: #0f5f54;
        --secondary-bg: #e8f4f1;
        --danger: #b42318;
        --danger-bg: #fff1f0;
        --danger-border: #ffd2ce;
        --glow: rgba(20, 120, 106, 0.18);
        --shadow: 0 18px 40px rgba(23, 32, 51, 0.10);
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #101413;
        --bg-alt: #171d1b;
        --panel: #18211f;
        --surface: #101917;
        --input: #111716;
        --text: #f2f7f5;
        --muted: #a7b8b2;
        --line: #30403b;
        --accent: #63d0b4;
        --accent-dark: #8de0cc;
        --secondary-bg: #213630;
        --danger: #ff8a80;
        --danger-bg: #351b1b;
        --danger-border: #6a2d2d;
        --glow: rgba(99, 208, 180, 0.14);
        --shadow: 0 18px 42px rgba(0, 0, 0, 0.38);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, var(--glow), transparent 34rem),
          linear-gradient(135deg, var(--bg) 0%, var(--bg-alt) 100%);
      }

      main {
        width: min(960px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      header {
        margin-bottom: 24px;
      }

      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.5;
        max-width: 62ch;
      }

      .calculator {
        display: grid;
        gap: 18px;
        padding: 20px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .settings {
        display: grid;
        grid-template-columns: minmax(180px, 260px);
        gap: 10px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      label {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .stat {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .stat strong {
        display: block;
        margin-top: 6px;
        font-size: 1.8rem;
      }

      .courses {
        display: grid;
        gap: 10px;
      }

      .course-row,
      .course-header {
        display: grid;
        grid-template-columns: minmax(130px, 1fr) 110px 150px 42px;
        gap: 10px;
        align-items: center;
      }

      .course-header {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      input,
      select,
      button {
        min-height: 42px;
        font: inherit;
      }

      input,
      select {
        width: 100%;
        padding: 0 12px;
        color: var(--text);
        background: var(--input);
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(20, 120, 106, 0.18);
      }

      html[data-theme="dark"] input:focus,
      html[data-theme="dark"] select:focus {
        box-shadow: 0 0 0 3px rgba(99, 208, 180, 0.20);
      }

      button {
        display: inline-grid;
        place-items: center;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .primary {
        padding: 0 16px;
        color: #ffffff;
        background: var(--accent);
      }

      .primary:hover {
        background: var(--accent-dark);
      }

      .secondary {
        padding: 0 16px;
        color: var(--accent-dark);
        background: var(--secondary-bg);
      }

      .remove {
        color: var(--danger);
        background: var(--danger-bg);
        border: 1px solid var(--danger-border);
      }

      .remove:hover {
        filter: brightness(0.97);
      }

      .empty-note {
        display: none;
        padding: 12px;
        margin: 0;
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 8px;
        text-align: center;
      }

      .empty .empty-note {
        display: block;
      }

      @media (max-width: 720px) {
        main {
          width: min(100% - 24px, 960px);
          padding: 24px 0;
        }

        .topbar {
          display: grid;
        }

        .settings,
        .summary {
          grid-template-columns: 1fr;
        }

        .course-header {
          display: none;
        }

        .course-row {
          grid-template-columns: 1fr 1fr 42px;
          padding: 12px;
          border: 1px solid var(--line);
          border-radius: 8px;
          background: var(--surface);
        }

        .course-row input[name="course"] {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="topbar">
          <div>
            <h1>GPA Calculator</h1>
            <p>Add your courses, choose the credit hours and grades, and get your GPA instantly.</p>
          </div>
          <button class="secondary" id="themeToggle" type="button" aria-pressed="false">Dark Mode</button>
        </div>
      </header>

      <section class="calculator" aria-label="GPA calculator">
        <div class="settings">
          <div class="field">
            <label for="scaleSelect">Grade Scale</label>
            <select id="scaleSelect">
              <option value="us">US 4.0 scale</option>
              <option value="german">German 1.0-5.0 scale</option>
            </select>
          </div>
        </div>

        <div class="summary" aria-live="polite">
          <div class="stat">
            <span id="resultLabel">GPA</span>
            <strong id="gpa">0.00</strong>
          </div>
          <div class="stat">
            <span>Credits</span>
            <strong id="credits">0</strong>
          </div>
          <div class="stat">
            <span>Courses</span>
            <strong id="courseCount">0</strong>
          </div>
        </div>

        <div class="courses" id="courses">
          <div class="course-header" aria-hidden="true">
            <span>Course</span>
            <span>Credits</span>
            <span>Grade</span>
            <span></span>
          </div>
        </div>

        <p class="empty-note" id="emptyNote">No courses yet.</p>

        <div class="actions">
          <button class="primary" id="addCourse" type="button">Add Course</button>
          <button class="secondary" id="exportGrades" type="button">Export CSV</button>
          <button class="secondary" id="reset" type="button">Reset</button>
        </div>
      </section>
    </main>

    <script>
      const gradeScales = {
        us: {
          resultLabel: "GPA",
          exportName: "US 4.0 scale",
          samples: [
            ["Math", 3, "A"],
            ["English", 3, "B+"],
            ["Science", 4, "A-"]
          ],
          grades: [
            ["A+", 4.0],
            ["A", 4.0],
            ["A-", 3.7],
            ["B+", 3.3],
            ["B", 3.0],
            ["B-", 2.7],
            ["C+", 2.3],
            ["C", 2.0],
            ["C-", 1.7],
            ["D+", 1.3],
            ["D", 1.0],
            ["F", 0.0]
          ]
        },
        german: {
          resultLabel: "Average",
          exportName: "German 1.0-5.0 scale",
          samples: [
            ["Mathematics", 3, "1.3"],
            ["German", 3, "2.0"],
            ["Science", 4, "1.7"]
          ],
          grades: [
            ["1.0", 1.0],
            ["1.3", 1.3],
            ["1.7", 1.7],
            ["2.0", 2.0],
            ["2.3", 2.3],
            ["2.7", 2.7],
            ["3.0", 3.0],
            ["3.3", 3.3],
            ["3.7", 3.7],
            ["4.0", 4.0],
            ["5.0", 5.0]
          ]
        }
      };

      const courses = document.querySelector("#courses");
      const scaleSelect = document.querySelector("#scaleSelect");
      const themeToggle = document.querySelector("#themeToggle");
      const exportButton = document.querySelector("#exportGrades");
      const resultLabel = document.querySelector("#resultLabel");
      const gpaOutput = document.querySelector("#gpa");
      const creditsOutput = document.querySelector("#credits");
      const courseCountOutput = document.querySelector("#courseCount");
      const calculator = document.querySelector(".calculator");

      let currentScale = localStorage.getItem("gradeScale") || "us";

      function getScale() {
        return gradeScales[currentScale];
      }

      function createGradeOptions(selectedGrade = getScale().grades[0][0]) {
        return getScale().grades
          .map(([grade, points]) => {
            const isSelected = grade === selectedGrade ? "selected" : "";
            return `<option value="${points}" ${isSelected}>${grade}</option>`;
          })
          .join("");
      }

      function addCourse(name = "", credits = 3, grade = getScale().grades[0][0]) {
        const row = document.createElement("div");
        const courseInput = document.createElement("input");
        const creditsInput = document.createElement("input");
        const gradeSelect = document.createElement("select");
        const removeButton = document.createElement("button");

        row.className = "course-row";

        courseInput.name = "course";
        courseInput.type = "text";
        courseInput.placeholder = "Course name";
        courseInput.value = name;

        creditsInput.name = "credits";
        creditsInput.type = "number";
        creditsInput.min = "0";
        creditsInput.step = "0.5";
        creditsInput.value = credits;
        creditsInput.setAttribute("aria-label", "Credit hours");

        gradeSelect.name = "grade";
        gradeSelect.setAttribute("aria-label", "Grade");
        gradeSelect.innerHTML = createGradeOptions(grade);

        removeButton.className = "remove";
        removeButton.type = "button";
        removeButton.textContent = "x";
        removeButton.setAttribute("aria-label", "Remove course");

        removeButton.addEventListener("click", () => {
          row.remove();
          calculateGpa();
        });

        [courseInput, creditsInput, gradeSelect].forEach((field) => {
          field.addEventListener("input", calculateGpa);
        });

        row.append(courseInput, creditsInput, gradeSelect, removeButton);
        courses.appendChild(row);
        calculateGpa();
      }

      function getCourseRows() {
        return [...document.querySelectorAll(".course-row")];
      }

      function calculateGpa() {
        const rows = getCourseRows();
        let totalCredits = 0;
        let totalPoints = 0;

        rows.forEach((row) => {
          const credits = Number(row.querySelector('[name="credits"]').value) || 0;
          const points = Number(row.querySelector('[name="grade"]').value) || 0;
          totalCredits += credits;
          totalPoints += credits * points;
        });

        const gpa = totalCredits > 0 ? totalPoints / totalCredits : 0;
        resultLabel.textContent = getScale().resultLabel;
        gpaOutput.textContent = gpa.toFixed(2);
        creditsOutput.textContent = totalCredits.toString();
        courseCountOutput.textContent = rows.length.toString();
        calculator.classList.toggle("empty", rows.length === 0);
        exportButton.disabled = rows.length === 0;
      }

      function applyScale(scaleKey) {
        currentScale = gradeScales[scaleKey] ? scaleKey : "us";
        scaleSelect.value = currentScale;
        localStorage.setItem("gradeScale", currentScale);

        getCourseRows().forEach((row) => {
          const select = row.querySelector('[name="grade"]');
          const selectedIndex = Math.max(select.selectedIndex, 0);
          select.innerHTML = createGradeOptions();
          select.selectedIndex = Math.min(selectedIndex, select.options.length - 1);
        });

        calculateGpa();
      }

      function resetCourses() {
        getCourseRows().forEach((row) => row.remove());
        getScale().samples.forEach(([name, credits, grade]) => addCourse(name, credits, grade));
      }

      function csvValue(value) {
        const text = String(value);
        return /[",\n]/.test(text) ? `"${text.replaceAll('"', '""')}"` : text;
      }

      function exportGrades() {
        const rows = getCourseRows();
        const csvRows = [
          ["Scale", getScale().exportName],
          [getScale().resultLabel, gpaOutput.textContent],
          ["Credits", creditsOutput.textContent],
          ["Courses", courseCountOutput.textContent],
          [],
          ["Course", "Credits", "Grade", "Points"]
        ];

        rows.forEach((row) => {
          const gradeSelect = row.querySelector('[name="grade"]');
          csvRows.push([
            row.querySelector('[name="course"]').value || "Untitled course",
            row.querySelector('[name="credits"]').value || "0",
            gradeSelect.options[gradeSelect.selectedIndex].textContent,
            gradeSelect.value
          ]);
        });

        const csv = csvRows.map((row) => row.map(csvValue).join(",")).join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        const link = document.createElement("a");
        const date = new Date().toISOString().slice(0, 10);

        link.href = URL.createObjectURL(blob);
        link.download = `gpa-calculator-${date}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
      }

      function setTheme(theme) {
        const nextTheme = theme === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = nextTheme;
        localStorage.setItem("theme", nextTheme);
        themeToggle.textContent = nextTheme === "dark" ? "Light Mode" : "Dark Mode";
        themeToggle.setAttribute("aria-pressed", String(nextTheme === "dark"));
      }

      document.querySelector("#addCourse").addEventListener("click", () => addCourse());
      document.querySelector("#reset").addEventListener("click", resetCourses);
      exportButton.addEventListener("click", exportGrades);
      scaleSelect.addEventListener("change", (event) => applyScale(event.target.value));
      themeToggle.addEventListener("click", () => {
        const currentTheme = document.documentElement.dataset.theme;
        setTheme(currentTheme === "dark" ? "light" : "dark");
      });

      const savedTheme = localStorage.getItem("theme") || "light";
      setTheme(savedTheme);
      applyScale(currentScale);
      resetCourses();
    </script>
  </body>
</html>
